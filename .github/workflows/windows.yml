# Pruebas en un Windows de verdad en cada cambio: compila, pasa las comprobaciones y prueba las manos y las ventanas
# contra el Bloc de notas (sin IA, no gasta nada). Si falla, guarda la captura de pantalla para ver qué pasó.
name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    # Varias versiones de Windows: 2022 (núcleo de Windows 10) y 2025 (núcleo de Windows 11 24H2), en inglés.
    # El PC de Javi (Windows 11 en español, pantalla al 125 %) es la tercera prueba: «asistente probar-windows».
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-2022, windows-2025]
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y comprobaciones
        shell: cmd
        run: asistente.cmd compilar
      - name: Ventanas abiertas (para el registro)
        shell: cmd
        run: asistente.cmd ventanas
      - name: Pruebas en Windows (Bloc de notas)
        shell: cmd
        run: asistente.cmd probar-windows
      - name: Captura de pantalla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captura-${{ matrix.sistema }}
          path: captura-prueba.png
          if-no-files-found: ignore
